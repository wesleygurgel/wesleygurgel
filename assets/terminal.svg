<text x="36" y="139" class="b">Wesley Gurgel · engenheiro de software</text>
<text x="36" y="162" class="">No mundo do desenvolvimento desde 2018 · UFRN, Bacharelado em TI (Eng. de Software)</text>
<text x="36" y="185" class="">Transformo problemas de negócio em software que roda em produção,</text>
<text x="36" y="208" class="">trabalhando em dupla com IA do desenho da solução ao deploy.</text>
<text x="36" y="242" class="a">wesley@dev</text>
<text x="121" y="242" class="d">:</text>
<text x="129" y="242" class="d">~</text>
<text x="143" y="242" class="d">$</text>
<text x="161" y="242" class="">cat como-trabalho.md</text>
<text x="36" y="265" class="a">1.</text>
<text x="62" y="265" class=""><tspan class="a">Eu decido, a IA acelera.</tspan><tspan> Defino o problema, a arquitetura e o critério de pronto.</tspan></text>
<text x="36" y="288" class="a">2.</text>
<text x="62" y="288" class=""><tspan class="a">Contexto antes de código.</tspan><tspan> Specs, regras do projeto e exemplos para a IA.</tspan></text>
<text x="36" y="311" class="a">3.</text>
<text x="62" y="311" class=""><tspan class="a">Nada vai sem revisão.</tspan><tspan> Leio o diff, rodo os testes e valido o comportamento.</tspan></text>
<text x="36" y="334" class="a">4.</text>
<text x="62" y="334" class=""><tspan class="a">Pequeno e verificável.</tspan><tspan> Entregas curtas, com testes, para errar barato.</tspan></text>
<text x="36" y="368" class="a">wesley@dev</text>
<text x="121" y="368" class="d">:</text>
<text x="129" y="368" class="d">~</text>
<text x="143" y="368" class="d">$</text>
<text x="161" y="368" class="">cat fundamentos.md</text>
<text x="36" y="391" class="d"># Linguagem e framework mudam. Estes fundamentos ficam.</text>
<text x="36" y="414" class="a">arquitetura</text>
<text x="170" y="414" class="">monólito modular · hexagonal · DDD · event-driven · ADRs</text>
<text x="36" y="437" class="a">padrões</text>
<text x="170" y="437" class="">design patterns · SOLID · clean code · refatoração segura</text>
<text x="36" y="460" class="a">dados</text>
<text x="170" y="460" class="">modelagem relacional · consultas e índices · migrações sem downtime</text>
<text x="36" y="483" class="a">sistemas</text>
<text x="170" y="483" class="">APIs e contratos · concorrência e assíncrono · filas · observabilidade</text>
<text x="36" y="506" class="a">qualidade</text>
<text x="170" y="506" class="">testes automatizados · revisão de código · CI/CD</text>
<text x="36" y="540" class="a">wesley@dev</text>
<text x="121" y="540" class="d">:</text>
<text x="129" y="540" class="d">~</text>
<text x="143" y="540" class="d">$</text>
<text x="161" y="540" class="">ls ferramentas/</text>
<text x="36" y="563" class="d"># o que uso para aplicar os fundamentos acima, e que troco quando o problema pede</text>
